services:
  postgres:
    image: postgres:16
    container_name: de-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME:-newanatandukar}
      POSTGRES_DB: banking_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRESQL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USERNAME:-newanatandukar}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
